<style>
:root{--bg:#FFF5F6;--surf:#fff;--ink:#2a1530;--mute:#6f5a78;--line:#FFE4E8;--pri:#E88EA0;--pri2:#FFE4E8;--acc:#B95A6E;--ok:#1f7a4d;--gold:#b8861b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f1e;--surf:#271830;--ink:#f6eaf3;--mute:#b79cc2;--line:#42284d;--pri:#e58bc6;--pri2:#3b1f45;--ok:#5fd596;--gold:#e6b84a}}
:root[data-theme="dark"]{--bg:#1a0f1e;--surf:#271830;--ink:#f6eaf3;--mute:#b79cc2;--line:#42284d;--pri:#e58bc6;--pri2:#3b1f45;--ok:#5fd596;--gold:#e6b84a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;max-width:420px;margin:0 auto;padding:0 16px 90px}
h1,h2,h3,button,.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:28px;margin:18px 0 2px;letter-spacing:-.5px}h2{font-size:18px;margin:22px 0 8px}h3{margin:0;font-size:17px}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
.badge{display:inline-block;background:var(--ink);color:var(--bg);font:700 12px system-ui;padding:6px 10px;border-radius:6px;margin:6px 0}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#1f9d55;color:#fff;text-decoration:none;font:600 15px system-ui;padding:12px;border-radius:10px;margin:10px 0}
.card{background:var(--surf);border:1.5px solid var(--line);border-radius:24px;padding:16px;margin:10px 0}
.card.big{border-color:var(--pri)}.card.star{border-width:2.5px}
.tag{font:700 11px system-ui;background:var(--pri);color:var(--surf);padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.price{font:700 26px system-ui;color:var(--acc)}.price small{font-size:13px;color:var(--mute);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:600 15px system-ui;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--pri);color:var(--surf)}
button.ghost{background:var(--pri2);color:var(--pri)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:420px;overflow-x:auto}nav button{flex:1 0 auto;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.split{font:13px system-ui;color:var(--mute);margin-top:6px}.split b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font:14px system-ui}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
input,select{width:100%;font:16px system-ui;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);margin:4px 0 10px}
.modal{position:fixed;inset:0;background:rgba(20,5,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.on{display:flex}
.sheet{background:var(--surf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.clause{border-left:4px solid var(--pri);padding:8px 12px;background:var(--pri2);border-radius:0 8px 8px 0;font-size:14px}
.sig{border:1.5px dashed var(--mute);border-radius:10px;width:100%;height:110px;touch-action:none;background:var(--surf)}
.note{font:13px system-ui;color:var(--mute);background:var(--pri2);padding:10px;border-radius:8px;margin:12px 0}
.ok{color:var(--ok);font-weight:700}
#sos{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:#d00;color:#fff;font:800 18px system-ui;border:3px solid #fff;display:none;align-items:center;justify-content:center;z-index:8;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#sos.hold{animation:sosf 3s linear}@keyframes sosf{from{box-shadow:0 0 0 0 rgba(220,0,0,.6)}to{box-shadow:0 0 0 28px rgba(220,0,0,0)}}
.flash{background:#d00;color:#fff;border-radius:10px;padding:12px;font:700 15px system-ui;animation:fl 1s steps(2) infinite}@keyframes fl{50%{background:#7a0000}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
h1{color:var(--acc)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#f3b6c8}}:root[data-theme="dark"]{--acc:#f3b6c8}
</style>
</head>
<body>
<h1>SheGo <small class="mute sans" style="font-size:12px">V14.4</small></h1>
<p class="mute">Rides by Women, For Women. Safe, scheduled, and trusted.</p>
<span class="badge">CARD ONLY • NO CASH — Paystack</span>
<a class="wa" href="https://wa.me/270661038817">WhatsApp support 066 103 8817</a>
<main id="app"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<nav><div id="nav"></div></nav>

<script>
const PAYMENT_POLICY={method:"CARD ONLY NO CASH",gateway:"Paystack",cash_allowed:false,channels:["card"]};
// Prices in rand; Paystack amounts are in cents (x100)
const PACKAGES=[
{id:"work",name:"Work monthly",price:2700,driver:2160,you:540,main:1,desc:"Mon–Fri to work and back. Same sister driver every day."},
{id:"allday",name:"All day service",price:1500,driver:1200,you:300,main:1,star:1,desc:"Included: unlimited grocery, errands, clinic, salon. 8am–6pm Mon–Sun. Fair use: 2 trips/day, 15km max per trip, then R5/km."},
{id:"combo",name:"Combo",price:3800,driver:3040,you:760,main:1,best:1,desc:"Work + All Day. Normally R4200, you save R400."},
{id:"school",name:"School",price:1200,driver:960,you:240,unit:"/kid/month",desc:"Safe school runs for each child."},
{id:"grocery",name:"Grocery trip",price:200,driver:160,you:40,unit:"/trip",desc:"Return trip, 1 hour wait, bags carried to your door."},
{id:"club",name:"Clubbing night",price:600,driver:480,you:120,unit:"/night",desc:"Home → club → driver waits all night → home. 7pm–4am."}];
const PERKM=[
{n:"Work per trip",base:0,km:8,d:"R6.40/km",y:"R1.60/km",note:"If not on monthly"},
{n:"Late night",base:80,km:6,d:"R64 + R4.80/km",y:"R16 + R1.20/km"},
{n:"Day ride",base:50,km:5,d:"R40 + R4/km",y:"R10 + R1/km"}];
PACKAGES.forEach(p=>p.paystack={amount:p.price*100,split:{driver:p.driver*100,platform:p.you*100}});
const R=n=>"R"+n.toLocaleString("en-ZA");
const state={tab:"home",sales:{work:3,allday:8,combo:2,school:4,grocery:12,club:5},sub:null,signed:false,mult:1};
const tabs=[];
const $=s=>document.querySelector(s);

function pkgCard(p){return `<div class="card ${p.main?'big':''} ${p.star?'star':''}">
<div class="row"><h3>${p.name}${p.star?'<span class="tag">MOST POPULAR</span>':''}${p.best?'<span class="tag">BEST VALUE</span>':''}</h3></div>
<div class="price">${R(p.price)} <small>${p.unit||"/month"}</small></div>
<p class="mute">${p.desc}</p>

<div class="row" style="margin-top:10px"><span class="mute">Card only</span><button onclick="checkout('${p.id}')">Pay by card</button></div></div>`}

function render(){
 const t=state.tab,a=$("#app");
 $("#nav").innerHTML=tabs.map(([k,l])=>`<button class="${t===k?'on':''}" onclick="go('${k}')">${l}</button>`).join("");
 if(t==="home"){
  a.innerHTML=`<h2>Choose your package</h2>${PACKAGES.filter(p=>p.main).map(pkgCard).join("")}
  <h2>Pay as you go</h2>${PACKAGES.filter(p=>!p.main).map(pkgCard).join("")}
  ${state.sub?`<div class="note ok">Active: ${state.sub}. Register and sign in to sign your contract.</div>`:""}`;
 }

let cv,cx,dr=false,inked=false;
function initSig(){cv=$("#sig");const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;cx=cv.getContext("2d");
 cx.lineWidth=2;cx.lineCap="round";cx.strokeStyle=getComputedStyle(document.body).color;inked=false;
 const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cx.beginPath();cx.moveTo(...pos(e))};
 cv.onpointermove=e=>{if(!dr)return;cx.lineTo(...pos(e));cx.stroke();inked=true};
 cv.onpointerup=()=>dr=false}
function clearSig(){cx.clearRect(0,0,cv.width,cv.height);inked=false}

<div class="card"><b class="sans">Add a pick-up for ${c.sel}</b><input id="sdt" placeholder="Title, e.g. School run" style="margin-top:8px"><input id="sdw" placeholder="Child or rider name"><input id="sda" placeholder="Pick-up address"><div class="row" style="gap:8px"><input id="sdm" type="time" value="06:45" style="margin:0"><select id="sdr" style="margin:0"><option value="once">Once</option><option value="wk">Mon to Fri</option><option value="all">Every day</option></select></div><label class="sans mute" style="display:block;margin-top:8px">Remind me</label><select id="sdl"><option value="10">10 minutes before</option><option value="15">15 minutes before</option><option value="30" selected>30 minutes before</option><option value="60">1 hour before</option></select>${c.err?`<div class="flash" role="alert">${c.err}</div>`:""}<button style="width:100%" onclick="addSched()">Add to schedule</button></div>
<div class="card"><b class="sans">Reminders</b><p class="mute sans">Alerts show here while the app is open. Accepted rides are added automatically. For reminders when the app is closed, add your schedule to your phone calendar.</p><div class="row" style="gap:8px;flex-wrap:wrap">${perm==="granted"?`<span class="ok sans">Phone notifications on \u2714</span>`:`<button class="ghost" onclick="notifOn()">Turn on notifications</button>`}<button class="ghost" onclick="testRem()">Test reminder</button><button class="ghost" onclick="icsDl()">Add to phone calendar</button></div></div>`};
RT.driver.splice(2,0,["sched","Schedule"],["chat","Chat"]);RT.client.splice(5,0,["chat","Chat"]);RT.parent.splice(1,0,["chat","Chat"]);
const myDrv=()=>state.me?DRV.find(d=>d.uid===state.me.id):null;
function gateModal(t){$("#sheet").style.cssText="max-height:85vh;overflow:auto";$("#sheet").innerHTML=`<h3 style="color:#d00">Cannot accept trip yet</h3><p>${esc(t)}</p><button style="width:100%" onclick="closeM();state.pt='doc';render()">Open my details</button>`;$("#modal").classList.add("on")}
function dvForm(){const u=state.me||{},p=u.dp||{},d=myDrv(),mk=(id,l,v,t)=>`<label class="sans mute">${l}</label><input id="${id}" type="${t||"text"}" value="${esc(v)}">`;
return `<h2>My details</h2><div class="card"><div class="row"><b class="sans">${esc((u.name||"")+" "+(u.surname||""))}</b><span class="tag" style="margin:0">${d?d.s:"not sent"}</span></div><p class="mute sans">${esc(u.email||"")} \u00b7 ${esc(u.phone||"")}<br>${esc(u.address||"")}</p>${d&&d.sent?`<div class="note ok">Sent to admin on ${esc(d.sent)}. Status: ${d.s}.</div>`:`<div class="note">Send your details to admin so you can be approved. You cannot accept trips until you are approved.</div>`}${mk("dp_id","ID number (13 digits)",p.id)}<label class="sans mute">Province</label><select id="dp_pv">${PV.map(([n])=>`<option ${n===(p.prov||"Gauteng")?"selected":""}>${n}</option>`).join("")}</select>${mk("dp_ar","Area / suburb",p.area)}${mk("dp_vm","Vehicle make and model",p.vehicle)}${mk("dp_vc","Vehicle colour",p.colour)}${mk("dp_vr","Registration number",p.reg)}${mk("dp_ln","Driver's licence number",p.lic)}${mk("dp_le","Licence expiry",p.licExp,"date")}<label class="sans" style="display:flex;gap:8px;align-items:flex-start"><input id="dp_pm" type="checkbox" style="width:auto;margin-top:4px" ${p.prdpMissing?"checked":""}> My PrDP is not submitted yet (admin can give 2 weeks temporary access)</label>${mk("dp_pn","PrDP number",p.prdp)}${mk("dp_pe","PrDP expiry",p.prdpExp,"date")}${mk("dp_in","Insurer and policy number (R5m passenger liability)",p.ins)}${mk("dp_ie","Insurance expiry",p.insExp,"date")}${mk("dp_re","Roadworthy expiry",p.rwExp,"date")}<label class="sans mute">Documents: ID, licence, PrDP, insurance proof (demo: file names only, not stored)</label><input id="dp_fl" type="file" multiple accept="image/*,.pdf"><label class="sans" style="display:flex;gap:8px;align-items:flex-start"><input id="dp_ok" type="checkbox" style="width:auto;margin-top:4px" ${p.ok?"checked":""}> I confirm these details are true and consent (POPIA) to SHE DRIVES admin seeing them.</label><div id="dp_err" class="sans" style="color:#c00;min-height:20px" role="alert"></div><button style="width:100%" onclick="submitDriver()">Send details to admin</button><p class="mute sans" style="font-size:12px">Bank details are captured securely by Paystack for payouts and are not shared with admin.</p></div>`}
function submitDriver(){const u=state.me;if(!u)return;const v=i=>$("#"+i).value.trim(),e=m=>{$("#dp_err").textContent=m},today=isoD(new Date());
const p={id:v("dp_id"),prov:v("dp_pv"),area:v("dp_ar"),vehicle:v("dp_vm"),colour:v("dp_vc"),reg:v("dp_vr"),lic:v("dp_ln"),licExp:v("dp_le"),prdp:v("dp_pn"),prdpExp:v("dp_pe"),ins:v("dp_in"),insExp:v("dp_ie"),rwExp:v("dp_re"),docs:[...($("#dp_fl").files||[])].map(f=>f.name),ok:$("#dp_ok").checked,prdpMissing:$("#dp_pm").checked};
u.dp=p;
if(p.id.replace(/[^0-9]/g,"").length!==13)return e("Please enter your 13-digit ID number.");
for(const k of["area","vehicle","colour","reg","lic",...(p.prdpMissing?[]:["prdp"]),"ins"])if(!p[k])return e("Please fill in all vehicle, licence, PrDP and insurance details.");
for(const [k,l] of[["licExp","licence"],["prdpExp","PrDP"],["insExp","insurance"],["rwExp","roadworthy"]]){if(p.prdpMissing&&k==="prdpExp")continue;if(!p[k])return e("Please add the "+l+" expiry date.");if(p[k]<today)return e("Your "+l+" has expired. Renew it before sending.")}
if(!p.ok)return e("Please confirm and consent to continue.");
let d=myDrv();if(!d){d={uid:u.id,n:"",a:"",p:"",s:"pending",e:0};DRV.push(d)}
Object.assign(d,{n:u.name+" "+u.surname,a:p.area,p:p.prov,prof:{...p,name:u.name,surname:u.surname,email:u.email,phone:u.phone,address:u.address},sent:new Date().toLocaleString("en-ZA")});if(!p.prdpMissing&&(d.s==="cancelled"||drvStatus(d)==="expired"))d.s="pending";render()}
const _dv=V.doc;V.doc=()=>drvBanner()+dvForm()+_dv();
const expW=d=>d&&d<isoD(new Date(Date.now()+30*864e5))?" \u26A0 expires soon":"";
function togDrv(k){state.openDrv=String(state.openDrv)===String(k)?null:k;render()}
function setDsK(k,s){DRV.find(x=>String(x.uid||x.n)===String(k)).s=s;render()}
function drvDetails(p,d){const mask=state.role==="province"?p.id.slice(0,6)+"*******":p.id,r=(l,v)=>`<tr><td>${l}</td><td>${esc(v||"-")}</td></tr>`;
return `<table style="margin-top:8px">${r("Full name",p.name+" "+p.surname)}${r("ID number",mask)}${r("Phone",p.phone)}${r("Email",p.email)}${r("Address",p.address)}${r("Province / area",p.prov+" / "+p.area)}${r("Vehicle",p.vehicle+", "+p.colour)}${r("Registration",p.reg)}${r("Licence",p.lic+" (exp "+p.licExp+")"+expW(p.licExp))}${r("PrDP",p.prdp+" (exp "+p.prdpExp+")"+expW(p.prdpExp))}${r("Insurance",p.ins+" (exp "+p.insExp+")"+expW(p.insExp))}${r("Roadworthy","exp "+p.rwExp+expW(p.rwExp))}${r("Documents",(p.docs||[]).join(", ")||"none attached")}${r("Sent",d.sent)}</table>`}
V.dr=()=>{const list=DRV.filter(vis);return provSel()+`<p class="mute sans">Drivers in view: ${list.length}${state.role==="super"?" (all provinces)":""}</p>`+list.map((d,i)=>{const k=d.uid||d.n,pr=d.prof,open=String(state.openDrv)===String(k);return `<div class="card"><div class="row"><h3>${esc(d.n)}</h3><span class="tag" style="margin:0">${d.s}</span></div><p class="mute">${esc(d.a)}, ${esc(d.p)}</p><p class="mute sans">Earnings are shown only in the driver's own account. Paid automatically by Paystack.</p><p class="mute" id="lv${i}"></p><div class="row" style="flex-wrap:wrap;gap:6px"><button class="ghost" onclick="trk(${i})">Track live</button>${pr?`<button class="ghost" onclick="togDrv('${k}')">${open?"Hide":"View"} details</button>`:`<span class="mute sans">No details sent yet</span>`}${state.role==="super"?`<button onclick="setDsK('${k}','approved')">Approve</button><button class="ghost" onclick="setDsK('${k}','blocked')">Block</button>`:""}</div>${pr&&open?drvDetails(pr,d):""}</div>`}).join("")+`<p class="mute">Drivers send their details from their own Documents tab. Only approved drivers can accept trips.</p>`};
const drvStatus=d=>d.s==="temporary"&&d.temp<isoD(new Date())?"expired":d.s;
function drvBanner(){const d=myDrv();if(!d)return "";const st=drvStatus(d);
if(st==="temporary"){const left=Math.max(0,Math.ceil((new Date(d.temp+"T23:59:59")-new Date())/864e5));return `<div class="note" role="status"><b>Temporary access granted</b> until ${d.temp} (${left} day${left===1?"":"s"} left). Submit your PrDP paperwork before then.</div>`}
if(st==="cancelled"||st==="expired")return `<div class="flash" role="alert">Your access is cancelled until your PrDP paperwork is submitted. Add it below and send your details again.</div>`;
if(st==="blocked")return `<div class="flash" role="alert">Your account is blocked. Contact admin on 066 103 8817.</div>`;return ""}
const _m2=V.mine;V.mine=()=>drvBanner()+_m2();
state.qd="";state.qc="";state.openCust=null;
function grantTemp(k){const d=DRV.find(x=>String(x.uid||x.n)===String(k));d.s="temporary";d.temp=isoD(new Date(Date.now()+14*864e5));d.reason="";render()}
function cancelDrv(k){const d=DRV.find(x=>String(x.uid||x.n)===String(k));d.s="cancelled";d.reason="PrDP paperwork not yet submitted";render()}
const dFlat=d=>[d.n,d.a,d.p,d.s,d.prof&&d.prof.email,d.prof&&d.prof.phone,d.prof&&d.prof.reg,d.prof&&d.prof.vehicle,d.prof&&d.prof.address].join(" ").toLowerCase();
function drvList(){const q=state.qd.trim().toLowerCase(),list=DRV.filter(vis).filter(d=>!q||q.split(" ").every(t=>dFlat(d).includes(t)));
return `<p class="mute sans">Drivers shown: ${list.length}</p>`+(list.map((d,i)=>{const k=d.uid||d.n,pr=d.prof,open=String(state.openDrv)===String(k),st=drvStatus(d);
return `<div class="card"><div class="row"><h3>${esc(d.n)}</h3><span class="tag" style="margin:0">${st}</span></div><p class="mute">${esc(d.a)}, ${esc(d.p)}</p>${pr&&pr.prdpMissing?`<p class="sans" style="color:#c00">\u26A0 PrDP not yet submitted</p>`:""}${d.s==="temporary"?`<p class="sans">Temporary access until ${d.temp}${st==="expired"?" (expired)":""}</p>`:""}${d.s==="cancelled"?`<p class="sans" style="color:#c00">Cancelled: ${esc(d.reason||"paperwork not submitted")}</p>`:""}<p class="mute sans">Earnings are shown only in the driver's own account. Paid automatically by Paystack.</p><p class="mute" id="lv${i}"></p><div class="row" style="flex-wrap:wrap;gap:6px"><button class="ghost" onclick="trk(${i})">Track live</button>${pr?`<button class="ghost" onclick="togDrv('${k}')">${open?"Hide":"View"} details</button>`:`<span class="mute sans">No details sent yet</span>`}</div>${state.role==="super"?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px"><button onclick="setDsK('${k}','approved')">Approve</button><button class="ghost" onclick="grantTemp('${k}')">Grant 2 weeks</button><button class="ghost" onclick="cancelDrv('${k}')">Cancel until paperwork</button><button class="ghost" onclick="setDsK('${k}','blocked')">Block</button></div>`:""}${pr&&open?drvDetails(pr,d):""}</div>`}).join("")||`<p class="mute">No drivers match.</p>`)}
V.dr=()=>provSel()+`<input type="search" placeholder="Search drivers by name, email, phone, area or registration" aria-label="Search drivers" value="${esc(state.qd)}" oninput="state.qd=this.value;document.getElementById('dlist').innerHTML=drvList()"><div id="dlist">${drvList()}</div><p class="mute">Drivers send their details from their own Documents tab. Only approved drivers, or drivers on 2 weeks temporary access, can accept trips.</p>`;
CL[1]="Customers";
const custAll=()=>[...MAM.map((m,i)=>({key:"s"+i,name:m.n,area:m.a,prov:m.p,plan:PK(m.k).name,s:m.s||"active",reason:m.reason,obj:m,sample:1})),...state.users.filter(u=>u.role!=="driver").map(u=>({key:"u"+u.id,name:u.name+" "+u.surname,email:u.email,phone:u.phone,address:u.address,area:"",prov:"",role:u.role,plan:u.plan||"none yet",s:u.status||"active",reason:u.reason,obj:u}))];
const cFlat=c=>[c.name,c.email,c.phone,c.address,c.area,c.prov,c.plan,c.s,c.role].join(" ").toLowerCase();
function togCust(k){state.openCust=state.openCust===k?null:k;render()}
function custSet(k,s){const c=custAll().find(x=>x.key===k);if(!c)return;const r=s==="cancelled"?($("#cr_"+k)||{}).value||"Cancelled by admin":"";if(c.sample)c.obj.s=s;else c.obj.status=s;c.obj.reason=r;render()}
function custList(){const q=state.qc.trim().toLowerCase(),L=custAll().filter(c=>state.role==="province"?c.sample&&c.prov===state.scope:(state.prov==="All"||c.prov===state.prov||!c.prov)).filter(c=>!q||q.split(" ").every(t=>cFlat(c).includes(t)));
return `<p class="mute sans">Customers shown: ${L.length}</p>`+(L.map(c=>{const open=state.openCust===c.key,sup=state.role==="super",rw=(l,v)=>`<tr><td>${l}</td><td>${esc(v||"-")}</td></tr>`;
return `<div class="card"><div class="row"><h3>${esc(c.name)}</h3><span class="tag" style="margin:0">${c.s}</span></div><p class="mute sans">${esc(c.plan)}${c.area?" \u00b7 "+esc(c.area):""}</p>${c.s==="cancelled"?`<p class="sans" style="color:#c00">Cancelled: ${esc(c.reason||"")}</p>`:""}<div class="row" style="flex-wrap:wrap;gap:6px"><button class="ghost" onclick="togCust('${c.key}')">${open?"Hide":"View"} profile</button></div>${sup?(c.s==="cancelled"?`<div style="margin-top:8px"><button onclick="custSet('${c.key}','active')">Reinstate account</button></div>`:`<div style="margin-top:8px"><select id="cr_${c.key}"><option>Safety concern</option><option>Non-payment</option><option>Misuse of service</option><option>Customer request</option></select><button class="ghost" onclick="custSet('${c.key}','cancelled')">Cancel account</button></div>`):""}${open?`<table style="margin-top:8px">${rw("Name",c.name)}${rw("Account type",c.role||"client")}${rw("Package / plan",c.plan)}${rw("Area",[c.area,c.prov].filter(Boolean).join(", "))}${sup?rw("Email",c.email)+rw("Mobile",c.phone)+rw("Address",c.address):""}</table>`:""}</div>`}).join("")||`<p class="mute">No customers match.</p>`)}
V.cl=()=>provSel()+`<input type="search" placeholder="Search customers by name, email, phone, address or plan" aria-label="Search customers" value="${esc(state.qc)}" oninput="state.qc=this.value;document.getElementById('clist').innerHTML=custList()"><div id="clist">${custList()}</div><p class="mute">Cancelled customers cannot sign in or book until reinstated.</p>`;
tabs.unshift(["landing","Start"]);state.tab="landing";
tabs.push(["login","Sign in"]);render();
</script>
