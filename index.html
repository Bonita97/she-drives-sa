 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHE DRIVES</title>
<style>
:root{--bg:#fbf5f7;--surf:#fff;--ink:#2a1530;--mute:#6f5a78;--line:#ead9e2;--pri:#7a1f5c;--pri2:#f3dcec;--ok:#1f7a4d;--gold:#b8861b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f1e;--surf:#271830;--ink:#f6eaf3;--mute:#b79cc2;--line:#42284d;--pri:#e58bc6;--pri2:#3b1f45;--ok:#5fd596;--gold:#e6b84a}}
:root[data-theme="dark"]{--bg:#1a0f1e;--surf:#271830;--ink:#f6eaf3;--mute:#b79cc2;--line:#42284d;--pri:#e58bc6;--pri2:#3b1f45;--ok:#5fd596;--gold:#e6b84a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;max-width:560px;margin:0 auto;padding:0 16px 90px}
h1,h2,h3,button,.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:28px;margin:18px 0 2px;letter-spacing:-.5px}h2{font-size:18px;margin:22px 0 8px}h3{margin:0;font-size:17px}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
.badge{display:inline-block;background:var(--ink);color:var(--bg);font:700 12px system-ui;padding:6px 10px;border-radius:6px;margin:6px 0}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#1f9d55;color:#fff;text-decoration:none;font:600 15px system-ui;padding:12px;border-radius:10px;margin:10px 0}
.card{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.card.big{border-color:var(--pri)}.card.star{border-width:2.5px}
.tag{font:700 11px system-ui;background:var(--pri);color:var(--surf);padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.price{font:700 26px system-ui;color:var(--pri)}.price small{font-size:13px;color:var(--mute);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:600 15px system-ui;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--pri);color:var(--surf)}
button.ghost{background:var(--pri2);color:var(--pri)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px;overflow-x:auto}nav button{flex:1 0 auto;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.split{font:13px system-ui;color:var(--mute);margin-top:6px}.split b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font:14px system-ui}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
input,select{width:100%;font:16px system-ui;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);margin:4px 0 10px}
.modal{position:fixed;inset:0;background:rgba(20,5,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.on{display:flex}
.sheet{background:var(--surf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.clause{border-left:4px solid var(--pri);padding:8px 12px;background:var(--pri2);border-radius:0 8px 8px 0;font-size:14px}
.sig{border:1.5px dashed var(--mute);border-radius:10px;width:100%;height:110px;touch-action:none;background:var(--surf)}
.note{font:13px system-ui;color:var(--mute);background:var(--pri2);padding:10px;border-radius:8px;margin:12px 0}
.ok{color:var(--ok);font-weight:700}
#sos{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:#d00;color:#fff;font:800 18px system-ui;border:3px solid #fff;display:none;align-items:center;justify-content:center;z-index:8;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#sos.hold{animation:sosf 3s linear}@keyframes sosf{from{box-shadow:0 0 0 0 rgba(220,0,0,.6)}to{box-shadow:0 0 0 28px rgba(220,0,0,0)}}
.flash{background:#d00;color:#fff;border-radius:10px;padding:12px;font:700 15px system-ui;animation:fl 1s steps(2) infinite}@keyframes fl{50%{background:#7a0000}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
</head>
<body>
<h1>SHE DRIVES</h1>
<p class="mute">Women drivers for women riders. Safe, scheduled, and trusted.</p>
<span class="badge">CARD ONLY • NO CASH — Paystack</span>
<a class="wa" href="https://wa.me/270661038817">WhatsApp support 066 103 8817</a>
<main id="app"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<nav><div id="nav"></div></nav>

<script>
const PAYMENT_POLICY={method:"CARD ONLY NO CASH",gateway:"Paystack",cash_allowed:false,channels:["card"]};
// Prices in rand; Paystack amounts are in cents (x100)
const PACKAGES=[
{id:"work",name:"Work monthly",price:2700,driver:2160,you:540,main:1,desc:"Mon–Fri to work and back. Same sister driver every day."},
{id:"allday",name:"All day service",price:1500,driver:1200,you:300,main:1,star:1,desc:"Included: unlimited grocery, errands, clinic, salon. 8am–6pm Mon–Sun. Fair use: 2 trips/day, 15km max per trip, then R5/km."},
{id:"combo",name:"Combo",price:3800,driver:3040,you:760,main:1,best:1,desc:"Work + All Day. Normally R4200, you save R400."},
{id:"school",name:"School",price:1200,driver:960,you:240,unit:"/kid/month",desc:"Safe school runs for each child."},
{id:"grocery",name:"Grocery trip",price:200,driver:160,you:40,unit:"/trip",desc:"Return trip, 1 hour wait, bags carried to your door."},
{id:"club",name:"Clubbing night",price:600,driver:480,you:120,unit:"/night",desc:"Home → club → driver waits all night → home. 7pm–4am."}];
const PERKM=[
{n:"Work per trip",base:0,km:8,d:"R6.40/km",y:"R1.60/km",note:"If not on monthly"},
{n:"Late night",base:80,km:6,d:"R64 + R4.80/km",y:"R16 + R1.20/km"},
{n:"Day ride",base:50,km:5,d:"R40 + R4/km",y:"R10 + R1/km"}];
PACKAGES.forEach(p=>p.paystack={amount:p.price*100,split:{driver:p.driver*100,platform:p.you*100}});
const R=n=>"R"+n.toLocaleString("en-ZA");
const state={tab:"home",sales:{work:3,allday:8,combo:2,school:4,grocery:12,club:5},sub:null,signed:false,mult:1};
const tabs=[["home","Home"],["trip","Per trip"],["contract","Contract"],["driver","Driver"],["owner","Owner"]];
const $=s=>document.querySelector(s);

function pkgCard(p){return `<div class="card ${p.main?'big':''} ${p.star?'star':''}">
<div class="row"><h3>${p.name}${p.star?'<span class="tag">MOST POPULAR</span>':''}${p.best?'<span class="tag">BEST VALUE</span>':''}</h3></div>
<div class="price">${R(p.price)} <small>${p.unit||"/month"}</small></div>
<p class="mute">${p.desc}</p>
<div class="split">Driver <b>${R(p.driver)}</b> (80%) · Platform <b>${R(p.you)}</b> (20%)</div>
<div class="row" style="margin-top:10px"><span class="mute">Card only</span><button onclick="checkout('${p.id}')">Pay by card</button></div></div>`}

function render(){
 const t=state.tab,a=$("#app");
 $("#nav").innerHTML=tabs.map(([k,l])=>`<button class="${t===k?'on':''}" onclick="go('${k}')">${l}</button>`).join("");
 if(t==="home"){
  a.innerHTML=`<h2>Choose your package</h2>${PACKAGES.filter(p=>p.main).map(pkgCard).join("")}
  <h2>Pay as you go</h2>${PACKAGES.filter(p=>!p.main).map(pkgCard).join("")}
  ${state.sub?`<div class="note ok">Active: ${state.sub}. Sign your contract in the Contract tab.</div>`:""}`;
 }
 if(t==="trip"){
  a.innerHTML=`<h2>Trip price estimator</h2><p class="mute">GPS distance is calculated in the live app. Enter km here.</p>
  <div class="card"><label class="sans mute">Trip type</label><select id="tt">${PERKM.map((p,i)=>`<option value="${i}">${p.n}</option>`).join("")}</select>
  <label class="sans mute">Distance (km)</label><input id="km" type="number" min="1" value="10" inputmode="decimal">
  <div class="price" id="est"></div><div class="split" id="estsplit"></div>
  <button style="margin-top:10px;width:100%" onclick="payTrip()">Pay by card</button></div>
  <p class="mute">Card only. No cash accepted, for rider and driver safety.</p>`;
  ["tt","km"].forEach(i=>$("#"+i).oninput=est);est();
 }
 if(t==="contract"){
  const pk=state.sub||"No package selected";
  a.innerHTML=`<h2>Rider contract</h2><div class="card"><p><b>Package:</b> ${pk}</p>
  <p class="mute">All Day fair use: 2 trips/day, 15km max, 8am–6pm.</p>
  <div class="clause sans"><b>PAYMENT POLICY: CARD ONLY • NO CASH.</b> All payments go through Paystack secure card payments. No cash is accepted, for rider and driver safety. The driver never handles cash. Earnings are auto-paid by Paystack to the driver's subaccount within 24 hours. Channels: card only.</div>
  <p class="mute" style="margin-top:10px">Support: WhatsApp 066 103 8817</p>
  <label class="sans mute">Full name</label><input id="nm" autocomplete="name">
  <label class="sans mute">Sign below</label><canvas class="sig" id="sig"></canvas>
  <div class="row"><button class="ghost" onclick="clearSig()">Clear</button><button onclick="signIt()">Sign contract</button></div>
  ${state.signed?'<p class="ok sans">Contract signed.</p>':''}</div>`;
  initSig();
 }
 if(t==="driver"){
  const rows=PACKAGES.map(p=>[p,state.sales[p.id]||0]);
  const tot=rows.reduce((s,[p,c])=>s+p.driver*c,0);
  a.innerHTML=`<h2>Driver earnings</h2><div class="note">Auto-paid by Paystack. No cash to collect. Card only.</div>
  <div class="card"><div class="mute sans">Sample month earnings</div><div class="price">${R(tot)}</div>
  <table><tr><th>Package</th><th>Rides</th><th>You earn</th></tr>${rows.map(([p,c])=>`<tr><td>${p.name}</td><td>${c}</td><td>${R(p.driver*c)}</td></tr>`).join("")}</table></div>`;
 }
 if(t==="owner"){
  const rows=PACKAGES.map(p=>[p,state.sales[p.id]||0]);
  const tot=rows.reduce((s,[p,c])=>s+p.you*c,0);
  a.innerHTML=`<h2>Owner dashboard</h2><div class="note">CARD ONLY policy: every payment is split 80/20 by Paystack automatically.</div>
  <div class="card"><div class="mute sans">Profit across ${state.mult} province${state.mult>1?'s':''}</div><div class="price">${R(tot*state.mult)}</div>
  <label class="sans mute">Provinces (1–9 multiplier)</label><select onchange="state.mult=+this.value;render()">${[1,2,3,4,5,6,7,8,9].map(n=>`<option ${n===state.mult?'selected':''}>${n}</option>`).join("")}</select>
  <table><tr><th>Package (you earn)</th><th>Sold</th><th>Income</th></tr>${rows.map(([p,c])=>`<tr><td>${p.name} ${R(p.you)}</td><td><input style="width:60px;margin:0;padding:4px" type="number" min="0" value="${c}" onchange="state.sales['${p.id}']=+this.value;render()"></td><td>${R(p.you*c)}</td></tr>`).join("")}</table></div>`;
 }
}
function go(t){state.tab=t;render();scrollTo(0,0)}
function est(){const p=PERKM[+$("#tt").value],km=Math.max(0,+$("#km").value||0);const tot=p.base+p.km*km;
 $("#est").textContent=R(Math.round(tot*100)/100);
 $("#estsplit").innerHTML=`Driver <b>${R(Math.round(tot*80)/100)}</b> · Platform <b>${R(Math.round(tot*20)/100)}</b>`}
function payTrip(){const p=PERKM[+$("#tt").value];const tot=p.base+p.km*(+$("#km").value||0);
 checkout(null,{name:p.n,price:tot})}

// Demo checkout. In your own site, replace the body with PaystackPop (see handoff note below).
function checkout(id,custom){
 const p=custom||PACKAGES.find(x=>x.id===id);
 $("#sheet").innerHTML=`<h3>${p.name}</h3><div class="price">${R(p.price)}</div>
 <span class="badge">CARD ONLY • NO CASH — Paystack</span>
 <label class="sans mute">Email</label><input id="em" type="email" placeholder="you@email.com" autocomplete="email">
 <button style="width:100%" onclick="payWithPaystack('${id||''}',${p.price})">Pay ${R(p.price)} by card</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancel</button>
 <div class="note">Demo mode: no real payment is taken. Cash options are removed everywhere.</div>`;
 $("#modal").classList.add("on");
}
function payWithPaystack(id,price){
 const email=$("#em").value;if(!/\S+@\S+\.\S+/.test(email)){$("#em").focus();$("#em").style.borderColor="red";return}
 /* Live version (host on your own domain, add <script src="https://js.paystack.co/v2/inline.js">):
 new PaystackPop().newTransaction({key:'pk_live_YOUR_KEY',email,amount:pkg.paystack.amount,currency:'ZAR',
  channels:['card'],subaccount:'ACCT_DRIVER_SUBACCOUNT_ID',transaction_charge:pkg.paystack.split.platform,bearer:'subaccount',
  metadata:{custom_fields:[{display_name:"Payment Policy",value:"CARD ONLY NO CASH"}]},
  onSuccess:r=>verifyTransaction(r.reference,id), onCancel:()=>alert('Payment cancelled. Card only, no cash')}); */
 const p=PACKAGES.find(x=>x.id===id);
 if(p&&p.main)state.sub=p.name;
 $("#sheet").innerHTML=`<h3 class="ok">Payment simulated</h3><p>Card payment of ${R(price)} recorded for ${email}.</p><button style="width:100%" onclick="closeM();go(${p&&p.main?"'contract'":"'home'"})">Continue</button>`;
}
function closeM(){$("#modal").classList.remove("on")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};

let cv,cx,dr=false,inked=false;
function initSig(){cv=$("#sig");const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;cx=cv.getContext("2d");
 cx.lineWidth=2;cx.lineCap="round";cx.strokeStyle=getComputedStyle(document.body).color;inked=false;
 const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cx.beginPath();cx.moveTo(...pos(e))};
 cv.onpointermove=e=>{if(!dr)return;cx.lineTo(...pos(e));cx.stroke();inked=true};
 cv.onpointerup=()=>dr=false}
function clearSig(){cx.clearRect(0,0,cv.width,cv.height);inked=false}
function signIt(){if(!$("#nm").value.trim()||!inked){alert("Enter your name and sign in the box.");return}state.signed=true;render()}
render();
</script>
<script>
const PV=[["Gauteng",40],["Western Cape",15],["KwaZulu-Natal",15],["Eastern Cape",8],["Free State",5],["Limpopo",6],["Mpumalanga",5],["North West",4],["Northern Cape",2]];
const SL={work:[1,4,14],allday:[3,12,46],combo:[1,3,11],school:[2,9,31],grocery:[6,30,118],club:[2,8,27]};
const DRV=[{n:"Thandi M.",a:"Soweto",p:"Gauteng",s:"approved",e:9840},{n:"Lerato K.",a:"Sandton",p:"Gauteng",s:"approved",e:8200},{n:"Zanele D.",a:"Durban North",p:"KwaZulu-Natal",s:"approved",e:7360},{n:"Aisha P.",a:"Cape Town",p:"Western Cape",s:"pending",e:0},{n:"Naledi S.",a:"Mangaung",p:"Free State",s:"blocked",e:1200}];
const MAM=[{n:"Mama Nomsa",a:"Soweto",p:"Gauteng",k:"allday",t:1,km:9},{n:"Mama Dineo",a:"Soweto",p:"Gauteng",k:"work",t:0,km:0},{n:"Mrs Naidoo",a:"Durban North",p:"KwaZulu-Natal",k:"combo",t:2,km:14},{n:"Mama Palesa",a:"Sandton",p:"Gauteng",k:"school",t:1,km:6},{n:"Ms Jacobs",a:"Cape Town",p:"Western Cape",k:"grocery",t:1,km:5}];
const TX=[["SD-1042","allday","Mama Nomsa"],["SD-1043","combo","Mrs Naidoo"],["SD-1044","club","Ms Jacobs"],["SD-1045","school","Mama Palesa"],["SD-1046","work","Mama Dineo"]].map(([r,k,c])=>({r,k,c,refunded:0}));
const RL=[["super","Super Admin","/admin","admin@shedrives.co.za","email"],["province","Province Admin","/province-admin","gauteng@shedrives.co.za","email"],["driver","Driver","/driver","066 111 0001","phone"],["client","Client / Mama","/client","066 222 0002","phone"],["parent","Parent (School)","/parent","066 333 0003","phone"],["finance","Finance (view only)","/finance","finance@shedrives.co.za","email"]];
const OV=["ov","Overview"],DR=["dr","Drivers"],CL=["cl","Mamas"],PX=["px","Paystack"];
const RT={super:[OV,DR,CL,PX,["rd","Rides"],["ct","Contracts"],["st","Settings"]],province:[OV,DR,CL],finance:[OV,PX],driver:[["mine","My rides"],["earn","Earnings"]],client:[["book","Book"],["track","My plan"]],parent:[["kid","School ride"]]};
const RN={super:"SHE DRIVES Super Admin",province:"Province Admin",finance:"Finance (view only)",driver:"Driver",client:"My rides",parent:"Parent"};
state.wa="066 103 8817";state.prov="All";state.role=null;state.lg=null;
const PK=id=>PACKAGES.find(p=>p.id===id);
const PS=n=>PV.find(x=>x[0]===n)[1];
const sh=()=>state.role==="province"?PS(state.scope):(state.prov==="All"?100:PS(state.prov));
const prof=(i,s)=>Math.round(PACKAGES.reduce((t,p)=>t+p.you*SL[p.id][i],0)*s/100);
const vis=x=>state.role==="province"?x.p===state.scope:(state.prov==="All"||x.p===state.prov);
const provSel=()=>state.role==="province"?`<p class="mute">Province: ${state.scope}</p>`:`<select onchange="state.prov=this.value;render()">${["All",...PV.map(x=>x[0])].map(n=>`<option ${n===state.prov?"selected":""}>${n}</option>`).join("")}</select>`;
const V={
ov:()=>{const s=sh();return provSel()+`<div class="row" style="gap:8px">${["Today","Week","Month"].map((l,i)=>`<div class="card" style="flex:1;text-align:center;padding:10px"><div class="mute sans">${l}</div><b class="sans">${R(prof(i,s))}</b></div>`).join("")}</div><h2>Profit by package (month)</h2><table><tr><th>Package</th><th>Each</th><th>Sold</th><th>Profit</th></tr>${PACKAGES.map(p=>`<tr><td>${p.name}</td><td>${R(p.you)}</td><td>${Math.round(SL[p.id][2]*s/100)}</td><td>${R(Math.round(p.you*SL[p.id][2]*s/100))}</td></tr>`).join("")}</table>${state.role==="province"?"":`<h2>Profit per province (month)</h2><table>${PV.map(([n,w])=>`<tr><td>${n}</td><td>${R(prof(2,w))}</td></tr>`).join("")}</table>`}<div class="note">Card only collections: all via Paystack. No cash.</div>`},
dr:()=>provSel()+DRV.filter(vis).map((d,i)=>`<div class="card"><div class="row"><h3>${d.n}</h3><span class="tag" style="margin:0">${d.s}</span></div><p class="mute">${d.a}, ${d.p}</p><p class="sans">Earned (80%): <b>${R(d.e)}</b>, auto-paid by Paystack</p><p class="mute" id="lv${i}"></p><div class="row"><button class="ghost" onclick="trk(${i})">Track live</button>${state.role==="super"?`<button onclick="setDs('${d.n}','approved')">Approve</button><button class="ghost" onclick="setDs('${d.n}','blocked')">Block</button>`:""}</div></div>`).join("")+`<p class="mute">Driver login: phone + OTP. Drivers see only their own rides and earnings.</p>`,
cl:()=>provSel()+MAM.filter(vis).map(m=>{const k=PK(m.k);return `<div class="card"><h3>${m.n}</h3><p class="mute">${m.a}, ${m.p}</p><p class="sans">${k.name} · <span class="ok">Card paid via Paystack</span></p>${m.k==="allday"||m.k==="combo"?`<div class="sans mute">Fair use today: ${m.t}/2 trips, ${m.km}/15 km</div><div style="height:8px;background:var(--pri2);border-radius:4px"><div style="height:8px;width:${m.t/2*100}%;background:var(--pri);border-radius:4px"></div></div>`:""}</div>`}).join(""),
px:()=>`<div class="note">Channel: card only. Auto split 80/20 to the driver subaccount. Bearer: subaccount. No cash handling.</div><table><tr><th>Ref</th><th>Package</th><th>Paid</th><th>Driver 80%</th></tr>${TX.map(t=>{const p=PK(t.k);return `<tr><td>${t.r}</td><td>${p.name}</td><td>${t.refunded?"Refunded":R(p.price)}</td><td>${R(p.driver)}</td></tr>${state.role==="super"&&!t.refunded?`<tr><td colspan="4"><button class="ghost" onclick="refund('${t.r}')">Refund ${t.c} (card)</button></td></tr>`:""}`}).join("")}</table>`,
